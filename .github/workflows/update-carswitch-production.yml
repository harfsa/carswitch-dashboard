name: Update CarSwitch production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Update verified listings
        env:
          PAGE_TIMEOUT_MS: "60000"
          WAIT_AFTER_LOAD_MS: "4000"
        run: python scripts/update_carswitch_production.py

      - name: Upload update report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: car-switch-production-report
          path: carswitch_update_report.json
          if-no-files-found: ignore

      - name: Commit updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carswitch_data.json
          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
          else
            git commit -m "chore: update verified CarSwitch listings"
            git push
          fi
